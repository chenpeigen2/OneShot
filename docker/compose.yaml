name: oneshot

services:
  pb:
    build:
      context: .
      dockerfile: Dockerfile.pb
    ports:
      - "5587:8090"
    environment:
      PB_SUPERUSER_EMAIL: ${ONESHOT_SUPERUSER_EMAIL:?set in .env}
      PB_SUPERUSER_PASSWORD: ${ONESHOT_SUPERUSER_PASSWORD:?set in .env}
    volumes:
      - pb_data:/pb_data
      # hooks 由控制面编译后写入共享卷（项目 pb_hooks/ 下的 .pb.js / .user.pb.js 产物）
      - pb_hooks:/pb_hooks

  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    ports:
      - "5588:7860"
    environment:
      ONESHOT_PB_URL: http://pb:8090
      # PB 的 sidecar 转发路由通过这个地址回打控制服务器（publish 时烘焙进 hooks）
      ONESHOT_SIDECAR_URL: http://control:7860
      ONESHOT_SUPERUSER_EMAIL: ${ONESHOT_SUPERUSER_EMAIL}
      ONESHOT_SUPERUSER_PASSWORD: ${ONESHOT_SUPERUSER_PASSWORD}
    volumes:
      - ../examples/todo:/project
      - pb_hooks:/data/pb_hooks
    depends_on:
      - pb

volumes:
  pb_data:
  pb_hooks:
