name: oneshot

services:
  pb:
    build:
      context: .
      dockerfile: Dockerfile.pb
    ports:
      - "5587:8090"
    environment:
      PB_SUPERUSER_EMAIL: ${ONESHOT_SUPERUSER_EMAIL:?set in .env}
      PB_SUPERUSER_PASSWORD: ${ONESHOT_SUPERUSER_PASSWORD:?set in .env}
    volumes:
      - pb_data:/pb_data
      # hooks 由控制面编译后写入共享卷（项目 pb_hooks/ 下的 .pb.js / .user.pb.js 产物）
      - pb_hooks:/pb_hooks
    healthcheck:
      # Dockerfile.pb 已装 curl；control 等 healthy 后再启动发布
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    ports:
      - "5588:7860"
    environment:
      ONESHOT_PB_URL: http://pb:8090
      # PB 的 sidecar 转发路由通过这个地址回打控制服务器（publish 时烘焙进 hooks）
      ONESHOT_SIDECAR_URL: http://control:7860
      ONESHOT_SUPERUSER_EMAIL: ${ONESHOT_SUPERUSER_EMAIL:?set in .env}
      ONESHOT_SUPERUSER_PASSWORD: ${ONESHOT_SUPERUSER_PASSWORD:?set in .env}
    volumes:
      - ../examples/todo:/control/project
      - pb_hooks:/data/pb_hooks
    depends_on:
      pb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pb_data:
  pb_hooks:
