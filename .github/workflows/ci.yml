name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm -r build

      - name: e2e 测试（隔离实例，99 项断言）
        run: node tests/run-e2e.mjs

      - name: 保留失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: tests/.tmp
          retention-days: 3
          if-no-files-found: ignore
